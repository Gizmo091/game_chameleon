version: '3.8'

services:
  api:
    image: ghcr.io/gizmo091/game_chameleon/api:latest
    container_name: chameleon-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  webapp:
    image: ghcr.io/gizmo091/game_chameleon/webapp:latest
    container_name: chameleon-webapp
    ports:
      - "${WEBAPP_PORT:-80}:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - api
