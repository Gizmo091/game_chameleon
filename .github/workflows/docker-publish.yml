name: Build and Push Docker Images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: lower
        run: echo "tags=${IMAGE_BASE,,}/api" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_BASE: ${{ env.IMAGE_BASE }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ steps.lower.outputs.tags }}:latest
            ${{ steps.lower.outputs.tags }}:${{ github.sha }}

  build-webapp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: lower
        run: echo "tags=${IMAGE_BASE,,}/webapp" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_BASE: ${{ env.IMAGE_BASE }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./webapp
          push: true
          tags: |
            ${{ steps.lower.outputs.tags }}:latest
            ${{ steps.lower.outputs.tags }}:${{ github.sha }}
